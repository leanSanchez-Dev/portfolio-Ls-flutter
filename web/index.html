<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portafolio de Leonardo Sánchez (lean.dev). Desarrollador Senior Full-Stack & Mobile en Popayán, Colombia con más de 6 años de experiencia en Flutter, Angular, Java y arquitecturas escalables.">
  <meta name="theme-color" content="#090A0F">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="lean.dev — Leonardo Sánchez | Senior Full-Stack & Mobile Developer">
  <meta property="og:description" content="Portafolio de Leonardo Sánchez (lean.dev). Full-Stack & Mobile: Flutter, Angular, Java. Popayán, Colombia.">
  <meta property="og:url" content="https://portfolio-lean-dev.web.app">
  <meta property="og:site_name" content="lean.dev">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="lean.dev — Leonardo Sánchez">
  <meta name="twitter:description" content="Senior Full-Stack & Mobile Developer. Flutter, Angular, Java.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="lean.dev">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>lean.dev — Leonardo Sánchez | Senior Full-Stack & Mobile Developer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      background-color: #090A0F;
      overflow: hidden;
    }
    .lean-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090A0F;
      z-index: 9999;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #F8FAFC;
      letter-spacing: 0.02em;
      transition: opacity 280ms ease;
    }
    .lean-loader span {
      font-weight: 700;
      font-size: 15px;
    }
    .lean-loader .dot {
      color: #6366F1;
    }
    .lean-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="lean-loader" class="lean-loader" aria-hidden="true">
    <span>lean<span class="dot">.</span>dev</span>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            var loader = document.getElementById('lean-loader');
            if (loader) {
              loader.classList.add('hidden');
              setTimeout(function() {
                if (loader && loader.parentNode) {
                  loader.parentNode.removeChild(loader);
                }
              }, 320);
            }
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
